name: Bug report
description: Report a reproducible Ajia EPUB Editor problem without sharing private book content.
title: '[Bug] '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not attach copyrighted, private, or DRM-protected EPUB files. Prefer a minimal self-authored fixture.
  - type: input
    id: version
    attributes:
      label: Version
      description: Version shown in the editor footer or GitHub release.
      placeholder: V0.1
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and operating system
      placeholder: Chrome 151 on Windows 11
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use non-sensitive text and describe the smallest reproducible workflow.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have not included private, copyrighted, confidential, or DRM-protected book content.
          required: true
