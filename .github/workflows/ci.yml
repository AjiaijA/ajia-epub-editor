name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          cache: npm
          node-version: 24
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npm run check
      - run: npm run test:coverage
      - run: npm run fixture:export
      - name: Verify exported fixture with EPUBCheck 5.3.0
        env:
          EPUBCHECK_SHA256: 6c07e68584b2e2ce2f89fe06e1246dfead3eb36b46b340e7d93524f29dcff6c5
        run: |
          curl --fail --location --silent --show-error \
            --output epubcheck.zip \
            https://github.com/w3c/epubcheck/releases/download/v5.3.0/epubcheck-5.3.0.zip
          echo "$EPUBCHECK_SHA256  epubcheck.zip" | sha256sum --check --strict
          unzip -q epubcheck.zip
          java -jar epubcheck-5.3.0/epubcheck.jar artifacts/epub2-phase2-export.epub
      - run: npm audit --audit-level=low
