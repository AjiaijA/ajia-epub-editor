# Ajia EPUB Editor private RC route.
# The target path is an atomic symlink to a versioned static release directory.
location = /tools/epub-editor {
    return 302 /tools/epub-editor/;
}

location ^~ /tools/epub-editor/ {
    root /var/www/html;
    index index.html;
    try_files $uri $uri/ =404;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; img-src 'self' data: blob:; font-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}
